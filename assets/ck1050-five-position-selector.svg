<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Lorlin CK1050 five-position Mod Type selector wiring</title>
  <desc id="desc">Pico GP2 through GP6 connect to selector contacts 1 through 5. Common A connects to ground. Contact 6 and the second pole, common C with contacts 7 through 12, remain unused.</desc>
  <rect width="1400" height="900" fill="#faf8f1"/>
  <style>
    .title{font:700 30px system-ui,-apple-system,sans-serif;fill:#252b2e}
    .sub{font:17px system-ui,-apple-system,sans-serif;fill:#656b6e}
    .head{font:700 19px ui-monospace,Menlo,monospace;fill:#252b2e}
    .label{font:700 16px ui-monospace,Menlo,monospace;fill:#252b2e}
    .small{font:15px ui-monospace,Menlo,monospace;fill:#656b6e}
    .white{fill:#fff}.muted{fill:#92999b}.ground{fill:#252525}
    .p1{fill:#674bc2}.p2{fill:#147f98}.p3{fill:#2e7650}.p4{fill:#bd6700}.p5{fill:#a23d7c}
  </style>

  <text x="48" y="52" class="title">Lesson 15 · use one pole as a five-position selector</text>
  <text x="48" y="84" class="sub">Wire by terminal label · common A goes to GND · no 3V3 connection</text>

  <g transform="translate(48 130)">
    <rect width="350" height="530" rx="20" fill="#087f47" stroke="#075e37" stroke-width="5"/>
    <text x="112" y="64" font-family="ui-monospace,Menlo,monospace" font-size="25" font-weight="700" fill="#fff">PICO 2</text>

    <circle cx="312" cy="130" r="9" fill="#f3cc44"/><text x="45" y="137" class="label white">GP2</text>
    <circle cx="312" cy="200" r="9" fill="#f3cc44"/><text x="45" y="207" class="label white">GP3</text>
    <circle cx="312" cy="270" r="9" fill="#f3cc44"/><text x="45" y="277" class="label white">GP4</text>
    <circle cx="312" cy="340" r="9" fill="#f3cc44"/><text x="45" y="347" class="label white">GP5</text>
    <circle cx="312" cy="410" r="9" fill="#f3cc44"/><text x="45" y="417" class="label white">GP6</text>
    <circle cx="312" cy="480" r="9" fill="#f3cc44"/><text x="45" y="487" class="label white">GND</text>
  </g>

  <g stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M360 260 H610" stroke="#674bc2"/>
    <path d="M360 330 H610" stroke="#147f98"/>
    <path d="M360 400 H610" stroke="#2e7650"/>
    <path d="M360 470 H610" stroke="#bd6700"/>
    <path d="M360 540 H610" stroke="#a23d7c"/>
    <path d="M360 610 H610" stroke="#252525"/>
  </g>

  <g transform="translate(610 205)">
    <rect width="330" height="470" rx="16" fill="#fff" stroke="#d7cfbc" stroke-width="2"/>
    <text x="22" y="38" class="head">POLE A · USED</text>

    <circle cx="18" cy="55" r="8" class="p1"/><text x="40" y="61" class="label">contact 1</text><text x="185" y="61" class="small">Rising saw</text>
    <circle cx="18" cy="125" r="8" class="p2"/><text x="40" y="131" class="label">contact 2</text><text x="185" y="131" class="small">Falling saw</text>
    <circle cx="18" cy="195" r="8" class="p3"/><text x="40" y="201" class="label">contact 3</text><text x="185" y="201" class="small">Triangle</text>
    <circle cx="18" cy="265" r="8" class="p4"/><text x="40" y="271" class="label">contact 4</text><text x="185" y="271" class="small">Sine</text>
    <circle cx="18" cy="335" r="8" class="p5"/><text x="40" y="341" class="label">contact 5</text><text x="185" y="341" class="small">Square</text>
    <circle cx="18" cy="405" r="8" class="ground"/><text x="40" y="411" class="label">common A</text><text x="185" y="411" class="small">GND</text>
    <text x="40" y="448" class="small">contact 6 · unused</text>
  </g>

  <g transform="translate(990 138)">
    <rect width="360" height="565" rx="16" fill="#fff" stroke="#d7cfbc" stroke-width="2"/>
    <text x="24" y="40" class="head">FRONT VIEW · SHAFT TOWARD YOU</text>
    <text x="24" y="67" class="small">Rear view is mirrored.</text>

    <circle cx="180" cy="270" r="145" fill="#e4e0d6" stroke="#4c5051" stroke-width="5"/>
    <circle cx="180" cy="270" r="67" fill="#faf8f1" stroke="#4c5051" stroke-width="4"/>
    <circle cx="180" cy="270" r="31" fill="#bdb8ab" stroke="#4c5051" stroke-width="3"/>

    <g font-family="ui-monospace,Menlo,monospace" font-size="17" font-weight="700" text-anchor="middle">
      <circle cx="110" cy="391" r="17" class="p1"/><text x="110" y="397" fill="#fff">1</text>
      <circle cx="59" cy="340" r="17" class="p2"/><text x="59" y="346" fill="#fff">2</text>
      <circle cx="40" cy="270" r="17" class="p3"/><text x="40" y="276" fill="#fff">3</text>
      <circle cx="59" cy="200" r="17" class="p4"/><text x="59" y="206" fill="#fff">4</text>
      <circle cx="110" cy="149" r="17" class="p5"/><text x="110" y="155" fill="#fff">5</text>
      <circle cx="180" cy="130" r="17" fill="#92999b"/><text x="180" y="136" fill="#fff">6</text>
      <circle cx="250" cy="149" r="17" fill="#c8c5bc"/><text x="250" y="155">7</text>
      <circle cx="301" cy="200" r="17" fill="#c8c5bc"/><text x="301" y="206">8</text>
      <circle cx="320" cy="270" r="17" fill="#c8c5bc"/><text x="320" y="276">9</text>
      <circle cx="301" cy="340" r="17" fill="#c8c5bc"/><text x="301" y="346">10</text>
      <circle cx="250" cy="391" r="17" fill="#c8c5bc"/><text x="250" y="397">11</text>
      <circle cx="180" cy="410" r="17" fill="#c8c5bc"/><text x="180" y="416">12</text>
      <circle cx="126" cy="304" r="21" class="ground"/><text x="126" y="310" fill="#fff">A</text>
      <circle cx="234" cy="236" r="21" fill="#c8c5bc"/><text x="234" y="242">C</text>
    </g>

    <text x="24" y="458" class="label">USED: A + 1 2 3 4 5</text>
    <text x="24" y="490" class="small">Unused: 6, C, 7–12</text>
    <text x="24" y="525" class="small">Trust moulded labels when wiring.</text>
  </g>

  <g transform="translate(48 748)">
    <rect width="1302" height="100" rx="12" fill="#fff" stroke="#d7cfbc" stroke-width="2"/>
    <text x="24" y="38" class="head">ACTIVE-LOW</text>
    <text x="24" y="70" class="small">Unselected GPIO = 1 from its internal pull-up. Selected GPIO = 0 because the switch connects it to common A → GND.</text>
  </g>
</svg>
