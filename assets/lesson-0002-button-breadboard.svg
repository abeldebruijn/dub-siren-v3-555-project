<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Raspberry Pi Pico breadboard with an LED and push button</title>
  <desc id="desc">GP15 connects through a one kilo-ohm resistor and red LED to ground. GP14 connects to one side of a push button. The opposite side of the button connects to ground.</desc>
  <defs>
    <pattern id="holes" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect x="9" y="9" width="10" height="10" rx="2" fill="#555b60"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-opacity=".16"/>
    </filter>
  </defs>

  <rect width="1200" height="650" fill="#f8f5ed"/>
  <text x="64" y="55" fill="#252b2e" font-family="system-ui, sans-serif" font-size="26" font-weight="700">Lesson 2 · add the button input</text>
  <text x="64" y="86" fill="#5f666a" font-family="system-ui, sans-serif" font-size="17">Unplug USB before changing the wiring</text>

  <!-- breadboard -->
  <g filter="url(#shadow)">
    <rect x="52" y="115" width="1096" height="470" rx="25" fill="#fdfdfb" stroke="#a8aaab" stroke-width="3"/>
    <line x1="84" y1="155" x2="1116" y2="155" stroke="#177cc1" stroke-width="4"/>
    <line x1="84" y1="195" x2="1116" y2="195" stroke="#d62e32" stroke-width="4"/>
    <line x1="84" y1="510" x2="1116" y2="510" stroke="#177cc1" stroke-width="4"/>
    <line x1="84" y1="550" x2="1116" y2="550" stroke="#d62e32" stroke-width="4"/>
    <text x="66" y="161" fill="#177cc1" font-family="system-ui" font-size="22">−</text>
    <text x="66" y="201" fill="#d62e32" font-family="system-ui" font-size="22">+</text>
    <text x="66" y="516" fill="#177cc1" font-family="system-ui" font-size="22">−</text>
    <text x="66" y="556" fill="#d62e32" font-family="system-ui" font-size="22">+</text>
    <rect x="92" y="220" width="1015" height="110" fill="url(#holes)"/>
    <rect x="92" y="370" width="1015" height="110" fill="url(#holes)"/>
    <rect x="92" y="331" width="1015" height="38" fill="#d7d7d5"/>
  </g>

  <!-- Pico -->
  <g filter="url(#shadow)">
    <rect x="120" y="245" width="330" height="210" rx="14" fill="#087a45" stroke="#075d36" stroke-width="4"/>
    <rect x="88" y="312" width="54" height="77" rx="8" fill="#b9bec0" stroke="#747b7e" stroke-width="3"/>
    <rect x="97" y="328" width="27" height="45" rx="4" fill="#555d61"/>
    <rect x="250" y="303" width="80" height="88" rx="5" fill="#263035"/>
    <circle cx="149" cy="274" r="12" fill="#f5ce2e"/><circle cx="420" cy="274" r="12" fill="#f5ce2e"/>
    <circle cx="149" cy="425" r="12" fill="#f5ce2e"/><circle cx="420" cy="425" r="12" fill="#f5ce2e"/>
    <text x="185" y="355" fill="#fff" font-family="system-ui, sans-serif" font-size="25" font-weight="700">PICO 2</text>
    <text x="182" y="380" fill="#c7ead8" font-family="system-ui, sans-serif" font-size="14">USB ←</text>
    <g fill="#f0cd35">
      <circle cx="180" cy="244" r="6"/><circle cx="208" cy="244" r="6"/><circle cx="236" cy="244" r="6"/><circle cx="264" cy="244" r="6"/><circle cx="292" cy="244" r="6"/><circle cx="320" cy="244" r="6"/><circle cx="348" cy="244" r="6"/><circle cx="376" cy="244" r="6"/><circle cx="404" cy="244" r="6"/>
      <circle cx="180" cy="456" r="6"/><circle cx="208" cy="456" r="6"/><circle cx="236" cy="456" r="6"/><circle cx="264" cy="456" r="6"/><circle cx="292" cy="456" r="6"/><circle cx="320" cy="456" r="6"/><circle cx="348" cy="456" r="6"/><circle cx="376" cy="456" r="6"/><circle cx="404" cy="456" r="6"/>
    </g>
  </g>

  <!-- ground rail from Pico -->
  <path d="M 348 244 C 348 170, 400 155, 475 155" fill="none" stroke="#202629" stroke-width="9" stroke-linecap="round"/>
  <circle cx="475" cy="155" r="8" fill="#202629"/>
  <text x="365" y="137" fill="#202629" font-family="system-ui, sans-serif" font-size="15" font-weight="700">GND rail</text>

  <!-- LED output: GP15, resistor, LED, ground -->
  <path d="M 404 456 L 515 456" fill="none" stroke="#ef8a22" stroke-width="8" stroke-linecap="round"/>
  <text x="426" y="496" fill="#9a4a00" font-family="system-ui, sans-serif" font-size="17" font-weight="700">GP15</text>
  <line x1="515" y1="456" x2="535" y2="456" stroke="#777" stroke-width="5"/>
  <rect x="535" y="444" width="82" height="24" rx="12" fill="#e7c899" stroke="#886f53" stroke-width="2"/>
  <rect x="550" y="444" width="7" height="24" fill="#7b3c15"/>
  <rect x="568" y="444" width="7" height="24" fill="#171717"/>
  <rect x="586" y="444" width="7" height="24" fill="#bd2d28"/>
  <rect x="603" y="444" width="7" height="24" fill="#c8a635"/>
  <line x1="617" y1="456" x2="650" y2="456" stroke="#777" stroke-width="5"/>
  <text x="544" y="430" fill="#35393b" font-family="system-ui, sans-serif" font-size="15">1 kΩ</text>
  <path d="M 650 456 L 650 387" stroke="#777" stroke-width="5"/>
  <path d="M 688 456 L 688 387" stroke="#777" stroke-width="5"/>
  <path d="M 639 387 Q 639 346 669 346 Q 699 346 699 387 Z" fill="#e83a32" fill-opacity=".82" stroke="#b72925" stroke-width="3"/>
  <path d="M 688 387 C 688 270, 560 260, 560 155" fill="none" stroke="#202629" stroke-width="8" stroke-linecap="round"/>
  <text x="625" y="323" fill="#a3221d" font-family="system-ui, sans-serif" font-size="17" font-weight="700">LED</text>

  <!-- button input -->
  <path d="M 376 456 C 430 525, 760 495, 800 420" fill="none" stroke="#7357bd" stroke-width="9" stroke-linecap="round"/>
  <text x="377" y="535" fill="#54349d" font-family="system-ui, sans-serif" font-size="17" font-weight="700">GP14 · input</text>
  <g filter="url(#shadow)">
    <line x1="800" y1="310" x2="800" y2="395" stroke="#777" stroke-width="7"/>
    <line x1="878" y1="310" x2="878" y2="395" stroke="#777" stroke-width="7"/>
    <rect x="783" y="305" width="112" height="92" rx="12" fill="#42494c" stroke="#252a2c" stroke-width="4"/>
    <rect x="813" y="277" width="52" height="55" rx="7" fill="#bdc2c4" stroke="#676e71" stroke-width="4"/>
    <circle cx="839" cy="305" r="17" fill="#92999c"/>
  </g>
  <path d="M 878 310 C 950 275, 965 155, 1020 155" fill="none" stroke="#202629" stroke-width="9" stroke-linecap="round"/>
  <text x="771" y="260" fill="#252b2e" font-family="system-ui, sans-serif" font-size="17" font-weight="700">push button</text>

  <!-- callouts -->
  <g font-family="system-ui, sans-serif">
    <circle cx="740" cy="425" r="19" fill="#7357bd"/><text x="734" y="432" fill="#fff" font-size="19" font-weight="700">1</text>
    <text x="720" y="465" fill="#54349d" font-size="16" font-weight="700">GP14 → one side</text>
    <circle cx="936" cy="230" r="19" fill="#202629"/><text x="930" y="237" fill="#fff" font-size="19" font-weight="700">2</text>
    <text x="958" y="236" fill="#202629" font-size="16" font-weight="700">opposite side → GND</text>
  </g>
</svg>
