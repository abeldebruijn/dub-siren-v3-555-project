<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Clear terminal wiring for Mod Rate and Mod Amount potentiometers</title>
  <desc id="desc">Viewed from behind with terminals facing you. On both potentiometers, the left outside terminal connects to 3V3 and the right outside terminal connects to ground. The Mod Rate centre terminal connects to GP26. The Mod Amount centre terminal connects to GP27.</desc>
  <rect width="1100" height="620" fill="#faf8f1"/>
  <text x="55" y="52" fill="#252b2e" font-family="system-ui" font-size="27" font-weight="700">Wire each potentiometer separately</text>
  <text x="55" y="82" fill="#656b6e" font-family="system-ui" font-size="17">View from behind · shaft points away from you · three terminals face you</text>

  <!-- Rate card -->
  <g transform="translate(55 115)" font-family="system-ui">
    <rect width="470" height="430" rx="18" fill="#fff" stroke="#cbc6b8" stroke-width="3"/>
    <rect width="470" height="62" rx="18" fill="#eee9dc"/>
    <rect y="45" width="470" height="17" fill="#eee9dc"/>
    <text x="28" y="40" fill="#252b2e" font-size="23" font-weight="700">LEFT KNOB · MOD RATE</text>

    <rect x="135" y="115" width="200" height="155" rx="32" fill="#b9b5aa" stroke="#56534d" stroke-width="4"/>
    <circle cx="235" cy="162" r="43" fill="#77736a"/>
    <circle cx="235" cy="162" r="14" fill="#d8d3c7"/>
    <text x="198" y="220" fill="#35383a" font-size="15" font-weight="700">BACK</text>

    <line x1="165" y1="270" x2="165" y2="345" stroke="#777" stroke-width="12" stroke-linecap="round"/>
    <line x1="235" y1="270" x2="235" y2="345" stroke="#777" stroke-width="12" stroke-linecap="round"/>
    <line x1="305" y1="270" x2="305" y2="345" stroke="#777" stroke-width="12" stroke-linecap="round"/>

    <circle cx="165" cy="300" r="16" fill="#d52d31"/><text x="160" y="306" fill="#fff" font-size="16" font-weight="700">1</text>
    <circle cx="235" cy="300" r="16" fill="#7357bd"/><text x="230" y="306" fill="#fff" font-size="16" font-weight="700">2</text>
    <circle cx="305" cy="300" r="16" fill="#202629"/><text x="300" y="306" fill="#fff" font-size="16" font-weight="700">3</text>

    <path d="M165 345 V375" stroke="#d52d31" stroke-width="8"/>
    <path d="M235 345 V375" stroke="#7357bd" stroke-width="8"/>
    <path d="M305 345 V375" stroke="#202629" stroke-width="8"/>
    <rect x="108" y="375" width="114" height="40" rx="8" fill="#fde5e5" stroke="#d52d31" stroke-width="2"/>
    <rect x="228" y="375" width="114" height="40" rx="8" fill="#eee8ff" stroke="#7357bd" stroke-width="2"/>
    <rect x="348" y="375" width="92" height="40" rx="8" fill="#e4e6e7" stroke="#202629" stroke-width="2"/>
    <path d="M305 375 H348" stroke="#202629" stroke-width="8"/>
    <text x="136" y="401" fill="#ac2025" font-size="17" font-weight="700">3V3</text>
    <text x="252" y="401" fill="#54349d" font-size="17" font-weight="700">GP26</text>
    <text x="374" y="401" fill="#202629" font-size="17" font-weight="700">GND</text>
    <text x="82" y="338" fill="#ac2025" font-size="14">outside</text>
    <text x="215" y="338" fill="#54349d" font-size="14">centre</text>
    <text x="320" y="338" fill="#202629" font-size="14">outside</text>
  </g>

  <!-- Amount card -->
  <g transform="translate(575 115)" font-family="system-ui">
    <rect width="470" height="430" rx="18" fill="#fff" stroke="#cbc6b8" stroke-width="3"/>
    <rect width="470" height="62" rx="18" fill="#eee9dc"/>
    <rect y="45" width="470" height="17" fill="#eee9dc"/>
    <text x="28" y="40" fill="#252b2e" font-size="23" font-weight="700">RIGHT KNOB · MOD AMOUNT</text>

    <rect x="135" y="115" width="200" height="155" rx="32" fill="#b9b5aa" stroke="#56534d" stroke-width="4"/>
    <circle cx="235" cy="162" r="43" fill="#77736a"/>
    <circle cx="235" cy="162" r="14" fill="#d8d3c7"/>
    <text x="198" y="220" fill="#35383a" font-size="15" font-weight="700">BACK</text>

    <line x1="165" y1="270" x2="165" y2="345" stroke="#777" stroke-width="12" stroke-linecap="round"/>
    <line x1="235" y1="270" x2="235" y2="345" stroke="#777" stroke-width="12" stroke-linecap="round"/>
    <line x1="305" y1="270" x2="305" y2="345" stroke="#777" stroke-width="12" stroke-linecap="round"/>

    <circle cx="165" cy="300" r="16" fill="#d52d31"/><text x="160" y="306" fill="#fff" font-size="16" font-weight="700">1</text>
    <circle cx="235" cy="300" r="16" fill="#167395"/><text x="230" y="306" fill="#fff" font-size="16" font-weight="700">2</text>
    <circle cx="305" cy="300" r="16" fill="#202629"/><text x="300" y="306" fill="#fff" font-size="16" font-weight="700">3</text>

    <path d="M165 345 V375" stroke="#d52d31" stroke-width="8"/>
    <path d="M235 345 V375" stroke="#167395" stroke-width="8"/>
    <path d="M305 345 V375" stroke="#202629" stroke-width="8"/>
    <rect x="108" y="375" width="114" height="40" rx="8" fill="#fde5e5" stroke="#d52d31" stroke-width="2"/>
    <rect x="228" y="375" width="114" height="40" rx="8" fill="#e3f4f8" stroke="#167395" stroke-width="2"/>
    <rect x="348" y="375" width="92" height="40" rx="8" fill="#e4e6e7" stroke="#202629" stroke-width="2"/>
    <path d="M305 375 H348" stroke="#202629" stroke-width="8"/>
    <text x="136" y="401" fill="#ac2025" font-size="17" font-weight="700">3V3</text>
    <text x="252" y="401" fill="#126681" font-size="17" font-weight="700">GP27</text>
    <text x="374" y="401" fill="#202629" font-size="17" font-weight="700">GND</text>
    <text x="82" y="338" fill="#ac2025" font-size="14">outside</text>
    <text x="215" y="338" fill="#126681" font-size="14">centre</text>
    <text x="320" y="338" fill="#202629" font-size="14">outside</text>
  </g>

  <g font-family="system-ui" font-size="16">
    <text x="55" y="585" fill="#ac2025" font-weight="700">1 = 3V3</text>
    <text x="180" y="585" fill="#54349d" font-weight="700">2 = centre wiper → ADC</text>
    <text x="415" y="585" fill="#202629" font-weight="700">3 = GND</text>
    <text x="690" y="585" fill="#656b6e">Power shared · wipers separate</text>
  </g>
</svg>
