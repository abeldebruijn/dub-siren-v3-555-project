<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 430" role="img" aria-labelledby="title desc">
  <title id="title">Why a capacitor across power is not a short circuit</title>
  <desc id="desc">A wire directly between 3.3 volts and ground allows continuous current and is dangerous. A capacitor has two separated plates. It briefly charges when voltage changes, then blocks steady direct current while absorbing fast noise.</desc>
  <rect width="1050" height="430" fill="#faf8f1"/>
  <text x="45" y="48" fill="#252b2e" font-family="system-ui" font-size="27" font-weight="700">Same two rails; very different paths</text>

  <g transform="translate(45 88)" font-family="system-ui">
    <rect width="450" height="290" rx="18" fill="#fff3f1" stroke="#c85a4c" stroke-width="3"/>
    <text x="25" y="40" fill="#9f341f" font-size="21" font-weight="700">WIRE ACROSS 3V3–GND · SHORT</text>
    <rect x="35" y="85" width="90" height="46" rx="8" fill="#fde5e5" stroke="#d52d31" stroke-width="3"/>
    <text x="58" y="114" fill="#ac2025" font-size="18" font-weight="700">3V3</text>
    <rect x="325" y="85" width="90" height="46" rx="8" fill="#e4e6e7" stroke="#202629" stroke-width="3"/>
    <text x="346" y="114" fill="#202629" font-size="18" font-weight="700">GND</text>
    <path d="M125 108 H325" stroke="#d52d31" stroke-width="11" stroke-linecap="round"/>
    <path d="M160 83 L205 108 L160 133 M220 83 L265 108 L220 133" fill="none" stroke="#fff" stroke-width="5"/>
    <text x="54" y="184" fill="#252b2e" font-size="17">Metal path remains open to current.</text>
    <text x="54" y="215" fill="#9f341f" font-size="17" font-weight="700">Continuous large DC current → dangerous</text>
    <text x="54" y="250" fill="#656b6e" font-size="16">Never connect these rails with only a wire.</text>
  </g>

  <g transform="translate(555 88)" font-family="system-ui">
    <rect width="450" height="290" rx="18" fill="#f1f7ed" stroke="#589047" stroke-width="3"/>
    <text x="25" y="40" fill="#2e6550" font-size="21" font-weight="700">CAPACITOR ACROSS 3V3–GND · BYPASS</text>
    <rect x="35" y="85" width="90" height="46" rx="8" fill="#fde5e5" stroke="#d52d31" stroke-width="3"/>
    <text x="58" y="114" fill="#ac2025" font-size="18" font-weight="700">3V3</text>
    <rect x="325" y="85" width="90" height="46" rx="8" fill="#e4e6e7" stroke="#202629" stroke-width="3"/>
    <text x="346" y="114" fill="#202629" font-size="18" font-weight="700">GND</text>
    <path d="M125 108 H205 M245 108 H325" stroke="#777" stroke-width="9"/>
    <path d="M205 68 V148 M245 68 V148" stroke="#756b4e" stroke-width="9"/>
    <rect x="211" y="75" width="28" height="66" fill="#f0d98a"/>
    <text x="176" y="170" fill="#756b4e" font-size="14" font-weight="700">insulator</text>
    <text x="54" y="205" fill="#252b2e" font-size="17">Separated plates store a tiny charge.</text>
    <text x="54" y="236" fill="#2e6550" font-size="17" font-weight="700">Brief changing current; steady DC blocked</text>
    <text x="54" y="268" fill="#656b6e" font-size="16">Fast noise gets a short local path to ground.</text>
  </g>
</svg>
