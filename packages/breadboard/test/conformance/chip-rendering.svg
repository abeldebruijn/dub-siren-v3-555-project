<svg xmlns="http://www.w3.org/2000/svg" role="img" width="388" height="100" viewBox="0 0 388 100" preserveAspectRatio="xMidYMid meet" overflow="hidden">
  <title>Demo breadboard diagram</title>
  <desc>2 rows, 2 terminal columns, 1 chips, 0 wires.</desc>
  <g data-layer="board">
    <rect x="18" y="10" width="352" height="76" rx="24" fill="#F5F2EB" stroke="#CDBF9D" stroke-width="3"/>
    <rect x="184" y="24" width="20" height="48" rx="8" fill="#D9CFB8"/>
  </g>
  <g data-layer="rails">
    <line x1="62" y1="32" x2="62" y2="64" stroke="#D64545" stroke-width="3"/>
    <line x1="94" y1="32" x2="94" y2="64" stroke="#252525" stroke-width="3"/>
    <line x1="294" y1="32" x2="294" y2="64" stroke="#D64545" stroke-width="3"/>
    <line x1="326" y1="32" x2="326" y2="64" stroke="#252525" stroke-width="3"/>
  </g>
  <g data-layer="holes">
    <circle cx="62" cy="42" r="4.25" fill="#544F45"/>
    <circle cx="94" cy="42" r="4.25" fill="#544F45"/>
    <circle cx="120" cy="42" r="4.25" fill="#544F45"/>
    <circle cx="142" cy="42" r="4.25" fill="#544F45"/>
    <circle cx="246" cy="42" r="4.25" fill="#544F45"/>
    <circle cx="268" cy="42" r="4.25" fill="#544F45"/>
    <circle cx="294" cy="42" r="4.25" fill="#544F45"/>
    <circle cx="326" cy="42" r="4.25" fill="#544F45"/>
    <circle cx="62" cy="64" r="4.25" fill="#544F45"/>
    <circle cx="94" cy="64" r="4.25" fill="#544F45"/>
    <circle cx="120" cy="64" r="4.25" fill="#544F45"/>
    <circle cx="142" cy="64" r="4.25" fill="#544F45"/>
    <circle cx="246" cy="64" r="4.25" fill="#544F45"/>
    <circle cx="268" cy="64" r="4.25" fill="#544F45"/>
    <circle cx="294" cy="64" r="4.25" fill="#544F45"/>
    <circle cx="326" cy="64" r="4.25" fill="#544F45"/>
  </g>
  <g data-layer="labels">
    <text x="62" y="25" text-anchor="middle" fill="#413B31" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold">LP <tspan font-size="8">+</tspan></text>
    <text x="94" y="25" text-anchor="middle" fill="#413B31" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold">LG <tspan font-size="8">−</tspan></text>
    <text x="294" y="25" text-anchor="middle" fill="#413B31" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold">RP <tspan font-size="8">+</tspan></text>
    <text x="326" y="25" text-anchor="middle" fill="#413B31" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold">RG <tspan font-size="8">−</tspan></text>
    <text x="142" y="25" text-anchor="middle" fill="#413B31" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold">LT</text>
    <text x="246" y="25" text-anchor="middle" fill="#413B31" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold">RT</text>
    <text x="142" y="35" text-anchor="middle" fill="#756E60" font-family="Menlo, Consolas, monospace" font-size="8" font-weight="bold">1</text>
    <text x="246" y="35" text-anchor="middle" fill="#756E60" font-family="Menlo, Consolas, monospace" font-size="8" font-weight="bold">1</text>
  </g>
  <g data-layer="chips">
    <g>
      <rect x="137" y="33" width="114" height="40" rx="10" fill="#E0B929" stroke="#3B382F" stroke-width="3"/>
      <circle cx="142" cy="42" r="5.25" fill="#E5C968" stroke="#FFF7CB" stroke-width="1.5"/>
      <circle cx="142" cy="64" r="5.25" fill="#E5C968" stroke="#FFF7CB" stroke-width="1.5"/>
      <circle cx="246" cy="64" r="5.25" fill="#E5C968" stroke="#FFF7CB" stroke-width="1.5"/>
      <circle cx="246" cy="42" r="5.25" fill="#E5C968" stroke="#FFF7CB" stroke-width="1.5"/>
      <svg x="137" y="33" width="114" height="40" overflow="hidden">
        <svg x="35%" y="0" width="30%" height="100%" overflow="hidden">
          <text x="50%" y="19" text-anchor="middle" fill="#252525" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold">Tiny</text>
          <text x="50%" y="29" text-anchor="middle" fill="#252525" font-family="Menlo, Consolas, monospace" font-size="8" font-weight="bold">U1</text>
        </svg>
        <svg x="0" y="0" width="35%" height="100%" overflow="hidden">
          <text x="12" y="11.5" text-anchor="start" fill="#252525" font-family="Menlo, Consolas, monospace" font-size="7" font-weight="bold">1</text>
          <text x="12" y="33.5" text-anchor="start" fill="#252525" font-family="Menlo, Consolas, monospace" font-size="7" font-weight="bold">2</text>
          <text x="26" y="11.5" text-anchor="start" fill="#252525" font-family="Menlo, Consolas, monospace" font-size="7" font-weight="bold">VCC</text>
          <text x="26" y="33.5" text-anchor="start" fill="#252525" font-family="Menlo, Consolas, monospace" font-size="7" font-weight="bold">OUT</text>
        </svg>
        <svg x="65%" y="0" width="35%" height="100%" overflow="hidden">
          <text x="100%" y="33.5" dx="-12" text-anchor="end" fill="#252525" font-family="Menlo, Consolas, monospace" font-size="7" font-weight="bold">3</text>
          <text x="100%" y="11.5" dx="-12" text-anchor="end" fill="#252525" font-family="Menlo, Consolas, monospace" font-size="7" font-weight="bold">4</text>
          <text x="100%" y="11.5" dx="-26" text-anchor="end" fill="#252525" font-family="Menlo, Consolas, monospace" font-size="7" font-weight="bold">GND</text>
        </svg>
      </svg>
    </g>
  </g>
  <g data-layer="wires"/>
  <g data-layer="markers"/>
</svg>
