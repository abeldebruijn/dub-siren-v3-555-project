<svg xmlns="http://www.w3.org/2000/svg" role="img" width="388" height="100" viewBox="0 0 388 100" preserveAspectRatio="xMidYMid meet" overflow="visible">
  <title>Demo breadboard diagram</title>
  <desc>2 rows, 2 terminal columns, 1 components, 0 wires, 0 annotations.</desc>
  <g data-layer="board">
    <rect x="18" y="10" width="352" height="76" rx="12" fill="#F5F2EB" stroke="#B9AD8D" stroke-width="3"/>
    <rect x="184" y="24" width="20" height="48" rx="8" fill="#DFD5B9"/>
  </g>
  <g data-layer="rails">
    <line x1="62" y1="32" x2="62" y2="64" stroke="#D64545" stroke-width="3"/>
    <line x1="94" y1="32" x2="94" y2="64" stroke="#252525" stroke-width="3"/>
    <line x1="294" y1="32" x2="294" y2="64" stroke="#D64545" stroke-width="3"/>
    <line x1="326" y1="32" x2="326" y2="64" stroke="#252525" stroke-width="3"/>
  </g>
  <g data-layer="holes">
    <circle cx="62" cy="42" r="4.25" fill="#D1CCC3"/>
    <circle cx="94" cy="42" r="4.25" fill="#D1CCC3"/>
    <circle cx="120" cy="42" r="4.25" fill="#D1CCC3"/>
    <circle cx="142" cy="42" r="4.25" fill="#D1CCC3"/>
    <circle cx="246" cy="42" r="4.25" fill="#D1CCC3"/>
    <circle cx="268" cy="42" r="4.25" fill="#D1CCC3"/>
    <circle cx="294" cy="42" r="4.25" fill="#D1CCC3"/>
    <circle cx="326" cy="42" r="4.25" fill="#D1CCC3"/>
    <circle cx="62" cy="64" r="4.25" fill="#D1CCC3"/>
    <circle cx="94" cy="64" r="4.25" fill="#D1CCC3"/>
    <circle cx="120" cy="64" r="4.25" fill="#D1CCC3"/>
    <circle cx="142" cy="64" r="4.25" fill="#D1CCC3"/>
    <circle cx="246" cy="64" r="4.25" fill="#D1CCC3"/>
    <circle cx="268" cy="64" r="4.25" fill="#D1CCC3"/>
    <circle cx="294" cy="64" r="4.25" fill="#D1CCC3"/>
    <circle cx="326" cy="64" r="4.25" fill="#D1CCC3"/>
  </g>
  <g data-layer="wires"/>
  <g data-layer="components">
    <g data-component="U1" data-kind="chip">
      <rect x="137" y="33" width="114" height="40" rx="6" fill="#E0B929" stroke="#3B382F" stroke-width="3"/>
    </g>
  </g>
  <g data-layer="annotations"/>
  <g data-layer="labels">
    <text x="62" y="25" text-anchor="middle" fill="#413B31" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold">LP <tspan font-size="8">+</tspan></text>
    <text x="94" y="25" text-anchor="middle" fill="#413B31" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold">LG <tspan font-size="8">−</tspan></text>
    <text x="294" y="25" text-anchor="middle" fill="#413B31" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold">RP <tspan font-size="8">+</tspan></text>
    <text x="326" y="25" text-anchor="middle" fill="#413B31" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold">RG <tspan font-size="8">−</tspan></text>
    <text x="142" y="25" text-anchor="middle" fill="#413B31" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold">LT</text>
    <text x="246" y="25" text-anchor="middle" fill="#413B31" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold">RT</text>
    <text x="142" y="35" text-anchor="middle" fill="#756E60" font-family="Menlo, Consolas, monospace" font-size="8" font-weight="bold">1</text>
    <text x="246" y="35" text-anchor="middle" fill="#756E60" font-family="Menlo, Consolas, monospace" font-size="8" font-weight="bold">1</text>
    <g data-component-label="U1">
      <text x="194" y="52" text-anchor="middle" fill="#252525" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold">Tiny</text>
      <text x="194" y="61" text-anchor="middle" fill="#252525" font-family="Menlo, Consolas, monospace" font-size="7" font-weight="bold">U1</text>
      <text x="149" y="44.5" text-anchor="start" fill="#252525" font-family="Menlo, Consolas, monospace" font-size="6" font-weight="bold">1</text>
      <text x="149" y="66.5" text-anchor="start" fill="#252525" font-family="Menlo, Consolas, monospace" font-size="6" font-weight="bold">2</text>
      <text x="239" y="66.5" text-anchor="end" fill="#252525" font-family="Menlo, Consolas, monospace" font-size="6" font-weight="bold">3</text>
      <text x="239" y="44.5" text-anchor="end" fill="#252525" font-family="Menlo, Consolas, monospace" font-size="6" font-weight="bold">4</text>
    </g>
  </g>
</svg>
